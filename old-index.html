<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyStreak</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f8a4c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5faf4;--card:#fff;--ink:#14301f;--mute:#5d7566;--green:#1f8a4c;--on:#fff;--mint:#dcf1e1;--line:#cfe3d3;--warn:#b4531a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--card:#15251b;--ink:#e6f3ea;--mute:#93ad9c;--green:#43c27a;--on:#08210f;--mint:#1d3a29;--line:#27402f;--warn:#e8934f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a13;--card:#15251b;--ink:#e6f3ea;--mute:#93ad9c;--green:#43c27a;--on:#08210f;--mint:#1d3a29;--line:#27402f;--warn:#e8934f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Hind",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
button,select,input{font:inherit;color:inherit}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
section{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.streak{display:flex;align-items:baseline;gap:10px}
.streak b{font-size:64px;line-height:1;color:var(--green);font-weight:700}
.sub{color:var(--mute);font-size:15px}
.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 12px;border-radius:999px;border:2px dashed var(--line);color:var(--mute);font-size:14px}
.badge.on{border:2px solid var(--green);background:var(--mint);color:var(--ink)}
.bar{height:14px;background:var(--mint);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.timer{font-size:54px;font-weight:700;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text]{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px}
.big{width:100%;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:700;background:var(--green);color:var(--on);cursor:pointer;margin-top:12px}
.big.stop{background:var(--warn);color:#fff}
.btn{border:2px solid var(--green);background:transparent;color:var(--green);border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:13px;color:var(--mute)}
.week span{display:block;width:100%;background:var(--green);border-radius:8px 8px 3px 3px;min-height:4px}
.week .zero span{background:var(--line)}
.subj{margin-top:10px}
.subj div:first-child{display:flex;justify-content:space-between}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:var(--mint);border-radius:999px;padding:4px 6px 4px 14px;display:flex;gap:6px;align-items:center}
.tag button{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--mute)}
.note{font-size:14px;color:var(--mute);margin-top:8px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<header><h1>StudyStreak</h1><button class="chip" id="lang" aria-label="Language">हिंदी</button></header>

<section>
  <div class="streak"><b id="streak">0</b><span id="streakLbl"></span></div>
  <div class="sub" id="best"></div>
  <div class="badges" id="badges"></div>
  <div class="note" id="grace"></div>
</section>

<section>
  <h2 id="tToday"></h2>
  <div class="sub" id="todayTxt"></div>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <div class="row"><label class="sub" for="goal" id="goalLbl"></label>
    <select id="goal"></select></div>
</section>

<section>
  <div class="timer" id="clock" role="timer" aria-live="off">00:00:00</div>
  <div class="row"><select id="pick" aria-label="Subject"></select></div>
  <button class="big" id="go"></button>
</section>

<section>
  <h2 id="tWeek"></h2>
  <div class="week" id="week"></div>
  <div id="subjBars"></div>
</section>

<section>
  <h2 id="tSubj"></h2>
  <div class="row"><input type="text" id="newS" maxlength="30"><button class="btn" id="addS"></button></div>
  <div class="tags" id="tags"></div>
</section>
</main>

<script>
(function(){
var T={
en:{streak:"day streak",best:"Best streak: ",today:"Today",of:" of ",goal:"Daily goal",start:"Start studying",stop:"Stop and save",week:"This week",subj:"Subjects",add:"Add",ph:"New subject, e.g. Maths",min:" min",hr:" hr",
grace:"Missing one day is fine. Two days in a row resets your streak.",b7:"7 days",b30:"30 days",b100:"100 days",none:"Add a subject to start",lang:"हिंदी",days:["Su","Mo","Tu","We","Th","Fr","Sa"],def:["Maths","Science","English"],nosubj:"No study time yet. Press Start.",rm:"Remove"},
hi:{streak:"दिन की स्ट्रीक",best:"सबसे लंबी स्ट्रीक: ",today:"आज",of:" / ",goal:"रोज़ का लक्ष्य",start:"पढ़ाई शुरू करें",stop:"रोकें और सेव करें",week:"इस हफ़्ते",subj:"विषय",add:"जोड़ें",ph:"नया विषय, जैसे गणित",min:" मिनट",hr:" घंटे",
grace:"एक दिन छूटे तो चलेगा। लगातार दो दिन छूटे तो स्ट्रीक ख़त्म होगी।",b7:"7 दिन",b30:"30 दिन",b100:"100 दिन",none:"शुरू करने के लिए विषय जोड़ें",lang:"English",days:["रवि","सोम","मंगल","बुध","गुरु","शुक्र","शनि"],def:["गणित","विज्ञान","अंग्रेज़ी"],nosubj:"अभी तक पढ़ाई दर्ज नहीं है। शुरू दबाएँ।",rm:"हटाएँ"}
};
var KEY="studystreak.v1",S;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load()||{lang:"en",goal:2,subjects:null,log:{},run:null,best:0};
if(!S.subjects)S.subjects=T[S.lang].def.slice();
var $=function(i){return document.getElementById(i)};
function t(){return T[S.lang]}
function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function daySecs(k){var o=S.log[k]||{},n=0;for(var s in o)n+=o[s];return n}
function calcStreak(){
  var d=new Date(),n=0,miss=0,first=true;
  for(var i=0;i<4000;i++){
    var secs=daySecs(key(d));
    if(secs>=60){n++;miss=0}
    else if(!(first)){miss++;if(miss>=2)break}
    first=false;d.setDate(d.getDate()-1);
  }
  return n;
}
function fmt(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(function(v){return(v<10?"0":"")+v}).join(":")}
function mins(s){var m=Math.round(s/60);return m>=60?(Math.floor(m/60)+t().hr+" "+(m%60)+t().min):m+t().min}
function liveSecs(){return S.run?Math.floor((Date.now()-S.run.start)/1000):0}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function render(){
  var L=t(),st=calcStreak();
  if(st>S.best){S.best=st;save()}
  document.documentElement.lang=S.lang==="hi"?"hi":"en";
  $("lang").textContent=L.lang;
  $("streak").textContent=st;$("streakLbl").textContent=L.streak;
  $("best").textContent=L.best+S.best;
  $("badges").innerHTML=[7,30,100].map(function(n){return '<span class="badge'+(S.best>=n?' on':'')+'">'+(S.best>=n?'★ ':'')+L["b"+n]+'</span>'}).join("");
  $("grace").textContent=L.grace;
  $("tToday").textContent=L.today;$("goalLbl").textContent=L.goal;
  var g=[0.5,1,1.5,2,3,4,5,6];
  $("goal").innerHTML=g.map(function(h){return '<option value="'+h+'"'+(h==S.goal?' selected':'')+'>'+h+L.hr+'</option>'}).join("");
  $("tWeek").textContent=L.week;$("tSubj").textContent=L.subj;
  $("newS").placeholder=L.ph;$("addS").textContent=L.add;
  var cur=$("pick").value;
  $("pick").innerHTML=S.subjects.length?S.subjects.map(function(s){return '<option>'+esc(s)+'</option>'}).join(""):'<option>'+L.none+'</option>';
  if(S.run)$("pick").value=S.run.subject;else if(cur&&S.subjects.indexOf(cur)>-1)$("pick").value=cur;
  $("pick").disabled=!!S.run||!S.subjects.length;
  $("go").textContent=S.run?L.stop:L.start;
  $("go").className="big"+(S.run?" stop":"");
  $("go").disabled=!S.subjects.length;
  $("tags").innerHTML=S.subjects.map(function(s,i){return '<span class="tag">'+esc(s)+'<button data-i="'+i+'" aria-label="'+L.rm+' '+esc(s)+'">×</button></span>'}).join("");
  weekly();tick();
}
function weekly(){
  var L=t(),d=new Date(),cols=[],tot={},mx=1;
  for(var i=6;i>=0;i--){var x=new Date();x.setDate(d.getDate()-i);var k=key(x),sec=daySecs(k);
    if(i===0)sec+=liveSecs();
    cols.push({d:L.days[x.getDay()],s:sec});if(sec>mx)mx=sec;
    var o=S.log[k]||{};for(var s in o)tot[s]=(tot[s]||0)+o[s];}
  if(S.run)tot[S.run.subject]=(tot[S.run.subject]||0)+liveSecs();
  $("week").innerHTML=cols.map(function(c){return '<div class="'+(c.s?'':'zero')+'" title="'+mins(c.s)+'"><span style="height:'+Math.max(4,Math.round(c.s/mx*90))+'%"></span>'+c.d+'</div>'}).join("");
  var names=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]}),tm=names.length?tot[names[0]]:1;
  $("subjBars").innerHTML=names.length?names.map(function(n){return '<div class="subj"><div><span>'+esc(n)+'</span><span class="sub">'+mins(tot[n])+'</span></div><div class="bar"><i style="width:'+Math.round(tot[n]/tm*100)+'%"></i></div></div>'}).join(""):'<p class="sub">'+L.nosubj+'</p>';
}
function tick(){
  var L=t(),run=liveSecs();
  $("clock").textContent=fmt(run);
  var done=daySecs(key(new Date()))+run,goal=S.goal*3600;
  $("todayTxt").textContent=mins(done)+L.of+S.goal+L.hr;
  $("prog").style.width=Math.min(100,done/goal*100)+"%";
}
$("go").onclick=function(){
  if(S.run){
    var secs=liveSecs(),k=key(new Date(S.run.start)),sub=S.run.subject;
    S.log[k]=S.log[k]||{};S.log[k][sub]=(S.log[k][sub]||0)+secs;S.run=null;
  }else{S.run={subject:$("pick").value,start:Date.now()}}
  save();render();
};
$("goal").onchange=function(){S.goal=parseFloat(this.value);save();tick()};
$("lang").onclick=function(){
  var old=T[S.lang].def,isDef=S.subjects.length===old.length&&S.subjects.every(function(s,i){return s===old[i]});
  S.lang=S.lang==="en"?"hi":"en";if(isDef)S.subjects=T[S.lang].def.slice();
  save();render();
};
function addSubject(){var v=$("newS").value.trim();if(v&&S.subjects.indexOf(v)<0){S.subjects.push(v);$("newS").value="";save();render()}}
$("addS").onclick=addSubject;
$("newS").onkeydown=function(e){if(e.key==="Enter")addSubject()};
$("tags").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  var i=+b.dataset.i;if(S.run&&S.run.subject===S.subjects[i])return;S.subjects.splice(i,1);save();render()};
setInterval(function(){if(S.run){tick();weekly()}},1000);
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
